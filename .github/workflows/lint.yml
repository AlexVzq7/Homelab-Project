---
name: Lint

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint yamllint hvac
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint -c ../.yamllint .
      # Le mot de passe Vault n'est pas disponible en CI : faux mot de passe, rien n'est déchiffré
      - run: echo dummy > /tmp/vault_pass && ansible-lint --offline
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: /tmp/vault_pass

  opentofu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [proxmox, pfsense]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate
