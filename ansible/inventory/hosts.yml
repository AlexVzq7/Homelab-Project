---
# Chaque machine est déclarée une seule fois ; les groupes fonctionnels se combinent par "children".
all:
  children:
    dns_server:
      vars:
        ansible_user: debian
      hosts:
        dns-1:
          ansible_host: 192.168.1.106

    ca_server:
      hosts:
        ca:
          ansible_host: 192.168.1.105

    ldap_servers:
      hosts:
        openldap:
          ansible_host: 192.168.1.103

    openbao_server:
      hosts:
        vault:
          ansible_host: 192.168.1.104

    opentofu_server:
      hosts:
        opentofu:
          ansible_host: 192.168.1.107

    postgres_server:
      hosts:
        postgres:
          ansible_host: 192.168.1.108

    workstations:
      hosts:
        ubuntu-gui:
          ansible_host: 192.168.1.101
          ansible_user: alex

    # Machines qui utilisent dns-1 comme résolveur
    dns_clients:
      vars:
        ansible_user: debian  # ubuntu-gui le surcharge (alex)
      children:
        ca_server:
        ldap_servers:
        openbao_server:
        opentofu_server:
        postgres_server:
        workstations:

    # pfSense n'accepte que la clé d'ansible-node : à lancer depuis ansible-node
    pfsense:
      vars:
        ansible_user: admin  # root sur pfSense ; la clé SSH doit être dans Authorized SSH Keys de admin
      hosts:
        192.168.1.1:
