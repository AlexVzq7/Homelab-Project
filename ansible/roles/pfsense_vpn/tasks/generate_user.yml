---
- name: "Récupérer le certificat de {{ item.name }}"
  community.general.xml:
    path: "{{ vpn_tmpdir.path }}/config.xml"
    xpath: "//cert[descr='{{ item.cert_name }}']/crt"
    content: "text"
  register: current_cert
  delegate_to: localhost

- name: "Récupérer la clé privée de {{ item.name }}"
  community.general.xml:
    path: "{{ vpn_tmpdir.path }}/config.xml"
    xpath: "//cert[descr='{{ item.cert_name }}']/prv"
    content: "text"
  register: current_key
  delegate_to: localhost
  no_log: true

- name: "Créer le fichier .ovpn de {{ item.name }}"
  ansible.builtin.template:
    src: client.j2
    dest: "{{ vpn_export_dir }}/{{ item.name }}VPN.ovpn"
    mode: "0600"
  vars:
    vpn_ca_cert: "{{ ca_node.matches[0].crt | b64decode }}"
    vpn_client_cert: "{{ current_cert.matches[0].crt | b64decode }}"
    vpn_client_key: "{{ current_key.matches[0].prv | b64decode }}"
    vpn_tls_crypt_pem: >-
      {{ '' if not (vpn_tls_crypt | bool)
         else (vpn_tls_crypt_key if vpn_tls_crypt_key | length > 0 else tls_node.matches[0].tls | b64decode) }}
  delegate_to: localhost
  no_log: true
