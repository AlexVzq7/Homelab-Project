---
- name: "Calculer l'empreinte de l'AppRole {{ approle.name }}"
  ansible.builtin.set_fact:
    approle_fingerprint: "{{ (approle | to_json(sort_keys=True)) | hash('sha256') }}"

- name: Lire l'empreinte enregistrée
  community.hashi_vault.vault_read:
    path: "{{ openbao_kv_mount }}/data/ansible-state/approle-{{ approle.name }}"
  register: approle_fp_check
  failed_when: false

# L'empreinte seule ne suffit pas : si l'AppRole ou la policy a été supprimée à la main,
# on la recrée quand même.
- name: "Vérifier l'existence de la policy {{ approle.policy_name }}"
  community.hashi_vault.vault_read:
    path: "sys/policies/acl/{{ approle.policy_name }}"
  register: approle_policy_check
  failed_when: false

- name: "Vérifier l'existence de l'AppRole {{ approle.name }}"
  community.hashi_vault.vault_read:
    path: "auth/approle/role/{{ approle.name }}"
  register: approle_role_check
  failed_when: false

- name: Déterminer si une écriture est nécessaire
  ansible.builtin.set_fact:
    approle_needs_write: >-
      {{ (approle_fp_check.data | default({}, true)).get('data', {}).get('data', {}).get('fingerprint', '') != approle_fingerprint
         or approle_policy_check.data is not defined
         or approle_role_check.data is not defined }}

- name: "Charger la policy {{ approle.policy_name }}"
  community.hashi_vault.vault_write:
    path: "sys/policies/acl/{{ approle.policy_name }}"
    data:
      policy: "{{ approle.policy_hcl }}"
  when: approle_needs_write | bool

- name: "Créer/mettre à jour l'AppRole {{ approle.name }}"
  community.hashi_vault.vault_write:
    path: "auth/approle/role/{{ approle.name }}"
    data:
      token_policies: "{{ approle.policy_name }}"
      token_ttl: "{{ approle.token_ttl }}"
      token_max_ttl: "{{ approle.token_max_ttl }}"
      secret_id_ttl: "{{ approle.secret_id_ttl }}"
      bind_secret_id: true
  when: approle_needs_write | bool

- name: Enregistrer la nouvelle empreinte
  community.hashi_vault.vault_write:
    path: "{{ openbao_kv_mount }}/data/ansible-state/approle-{{ approle.name }}"
    data:
      data:
        fingerprint: "{{ approle_fingerprint }}"
  when: approle_needs_write | bool

- name: Lire le role_id
  community.hashi_vault.vault_read:
    path: "auth/approle/role/{{ approle.name }}/role-id"
  register: approle_role_id
  check_mode: false
  # En check mode sur une AppRole pas encore créée, la lecture échoue : sans conséquence
  failed_when: approle_role_id.data is not defined and not ansible_check_mode
  no_log: true

- name: Créer le répertoire de livraison sur la machine cible
  ansible.builtin.file:
    path: "{{ approle.deliver_dir }}"
    state: directory
    owner: "{{ approle.deliver_user }}"
    mode: "0750"
  delegate_to: "{{ groups[approle.deliver_group][0] }}"
  become: true

- name: Livrer le certificat CA
  ansible.builtin.copy:
    src: "{{ homelab_ca_cert }}"
    dest: "{{ approle.deliver_dir }}/ca.crt"
    mode: "0644"
  delegate_to: "{{ groups[approle.deliver_group][0] }}"
  become: true

- name: Livrer le role_id
  ansible.builtin.copy:
    content: "{{ approle_role_id.data.data.role_id }}"
    dest: "{{ approle.deliver_dir }}/{{ approle.name }}.role_id"
    owner: "{{ approle.deliver_user }}"
    mode: "0600"
  delegate_to: "{{ groups[approle.deliver_group][0] }}"
  become: true
  when: approle_role_id.data is defined
  no_log: true

- name: Vérifier la présence du secret_id sur la machine cible
  ansible.builtin.stat:
    path: "{{ approle.deliver_dir }}/{{ approle.name }}.secret_id"
  delegate_to: "{{ groups[approle.deliver_group][0] }}"
  become: true
  register: approle_secret_id_file

- name: Lire le secret_id livré
  ansible.builtin.slurp:
    src: "{{ approle.deliver_dir }}/{{ approle.name }}.secret_id"
  delegate_to: "{{ groups[approle.deliver_group][0] }}"
  become: true
  register: approle_current_secret_id
  when: approle_secret_id_file.stat.exists
  no_log: true

# Demande à OpenBao si ce secret_id existe encore et quand il expire.
# Réponse vide = secret_id inconnu (expiré, détruit ou jamais créé).
- name: "Vérifier auprès d'OpenBao la validité du secret_id {{ approle.name }}"
  community.hashi_vault.vault_write:
    path: "auth/approle/role/{{ approle.name }}/secret-id/lookup"
    data:
      secret_id: "{{ approle_current_secret_id.content | b64decode | trim }}"
  register: approle_secret_id_lookup
  when: approle_secret_id_file.stat.exists
  check_mode: false
  changed_when: false
  failed_when: false
  no_log: true

- name: Décider s'il faut un nouveau secret_id
  vars:
    _info: "{{ (approle_secret_id_lookup.data | default({}, true)).get('data') or {} }}"
    _expiration: "{{ _info.get('expiration_time', '') }}"
    # secret_id_ttl 0 : OpenBao renvoie la date 0001-01-01, le secret_id n'expire jamais
    _never_expires: "{{ _expiration.startswith('0001-') }}"
    _days_left: >-
      {{ ((_expiration[:19] | to_datetime('%Y-%m-%dT%H:%M:%S'))
          - (now(utc=true).replace(tzinfo=None))).total_seconds() / 86400
         if (_expiration | length > 0 and not _never_expires | bool) else 9999 }}
  ansible.builtin.set_fact:
    approle_secret_id_valid: "{{ _info | length > 0 }}"
    approle_secret_id_days_left: "{{ _days_left | float | round(1) }}"
    approle_needs_secret_id: >-
      {{ not approle_secret_id_file.stat.exists
         or openbao_approle_rotate | bool
         or _info | length == 0
         or (_days_left | float) < (openbao_approle_renew_before_days | float) }}

- name: "État du secret_id {{ approle.name }}"
  ansible.builtin.debug:
    msg: >-
      fichier présent={{ approle_secret_id_file.stat.exists }},
      valide={{ approle_secret_id_valid }},
      jours restants={{ approle_secret_id_days_left }},
      renouvellement={{ approle_needs_secret_id }}

- name: "Générer un nouveau secret_id {{ approle.name }}"
  community.hashi_vault.vault_write:
    path: "auth/approle/role/{{ approle.name }}/secret-id"
    data:
      metadata: '{"source": "openbao-approle"}'
  when: approle_needs_secret_id | bool
  register: approle_new_secret_id
  no_log: true

- name: Livrer le secret_id
  ansible.builtin.copy:
    content: "{{ approle_new_secret_id.data.data.secret_id }}"
    dest: "{{ approle.deliver_dir }}/{{ approle.name }}.secret_id"
    owner: "{{ approle.deliver_user }}"
    mode: "0600"
  when: approle_new_secret_id is changed and not ansible_check_mode
  delegate_to: "{{ groups[approle.deliver_group][0] }}"
  become: true
  no_log: true

# L'ancien secret_id encore valide ne doit pas rester utilisable après la rotation
- name: Détruire l'ancien secret_id
  community.hashi_vault.vault_write:
    path: "auth/approle/role/{{ approle.name }}/secret-id/destroy"
    data:
      secret_id: "{{ approle_current_secret_id.content | b64decode | trim }}"
  when:
    - approle_new_secret_id is changed
    - not ansible_check_mode
    - approle_secret_id_valid | bool
  no_log: true
