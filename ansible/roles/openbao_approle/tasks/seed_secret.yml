---
# Lecture par l'API HTTP : on se base sur le code retour (404 = absent),
# pas sur le texte du message d'erreur du module.
- name: "Lire {{ secret.path }}"
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/{{ openbao_kv_mount }}/data/{{ secret.path }}"
    headers:
      X-Vault-Token: "{{ openbao_token }}"
    ca_path: "{{ homelab_ca_cert }}"
    status_code: [200, 404]
  register: seed_check
  check_mode: false
  no_log: true

# Les anciennes versions du rôle écrivaient la clé littérale "{{ secret.field }}" :
# on reprend alors sa valeur sous le bon nom.
- name: "Écrire le secret s'il est absent ou mal nommé : {{ secret.path }}"
  community.hashi_vault.vault_write:
    path: "{{ openbao_kv_mount }}/data/{{ secret.path }}"
    data: "{{ {'data': {secret.field: seed_value}} }}"
  vars:
    seed_existing: "{{ seed_check.json.data.data if seed_check.status == 200 else {} }}"
    seed_value: >-
      {{ seed_existing.get('{' ~ '{ secret.field }' ~ '}')
         or lookup('ansible.builtin.password', '/dev/null length=' ~ secret.length ~ ' chars=ascii_letters,digits') }}
  when: seed_check.status == 404 or secret.field not in seed_existing
  no_log: true
