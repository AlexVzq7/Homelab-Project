---
# tasks file for roles/openbao_ldap_auth

- name: Récupérer le certificat CA depuis le serveur LDAP
  ansible.builtin.slurp:
    src: "{{ ldap_ca_cert_path_on_ldap_host }}"
  delegate_to: "{{ groups['ldap_servers'][0] }}"
  register: ldap_ca_cert_b64

- name: Mettre en cache le certificat CA localement pour les appels API
  ansible.builtin.copy:
    content: "{{ ldap_ca_cert_b64.content | b64decode }}"
    dest: "{{ homelab_ca_local_cache }}"
    mode: "0644"

- name: Vérifier si le moteur KV v2 est déjà monté
  community.hashi_vault.vault_read:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: "sys/mounts/{{ openbao_kv_mount }}/tune"
  register: kv_mount_check
  failed_when: false

- name: Activer le moteur KV v2
  community.hashi_vault.vault_write:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: "sys/mounts/{{ openbao_kv_mount }}"
    data:
      type: kv-v2
  when: kv_mount_check is failed

- name: Vérifier si la méthode d'auth LDAP est déjà activée
  community.hashi_vault.vault_read:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: "sys/auth/ldap/tune"
  register: ldap_auth_check
  failed_when: false

- name: Activer la méthode d'auth LDAP
  community.hashi_vault.vault_write:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: sys/auth/ldap
    data:
      type: ldap
  when: ldap_auth_check is failed

- name: Calculer l'empreinte de la configuration LDAP souhaitée
  ansible.builtin.set_fact:
    ldap_config_desired_fingerprint: >-
      {{ (
        ldap_auth_url ~ '|' ~
        ldap_auth_binddn ~ '|' ~
        openbao_ldap_bind_password ~ '|' ~
        ldap_auth_userdn ~ '|' ~
        ldap_auth_userattr ~ '|' ~
        ldap_auth_groupdn ~ '|' ~
        ldap_auth_groupattr ~ '|' ~
        (ldap_auth_starttls | string) ~ '|' ~
        (ldap_ca_cert_b64.content | b64decode)
      ) | hash('sha256') }}
  no_log: true  # défense en profondeur : le résultat est un simple hash, mais on protège la valeur intermédiaire

- name: Lire l'empreinte de configuration actuellement enregistrée
  community.hashi_vault.vault_read:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: "{{ openbao_kv_mount }}/data/ansible-state/ldap-auth-config"
  register: ldap_config_fingerprint_check
  failed_when: false

- name: Configurer le backend d'auth LDAP (si modifié)
  community.hashi_vault.vault_write:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: auth/ldap/config
    data:
      url: "{{ ldap_auth_url }}"
      certificate: "{{ ldap_ca_cert_b64.content | b64decode }}"
      binddn: "{{ ldap_auth_binddn }}"
      bindpass: "{{ openbao_ldap_bind_password }}"
      userdn: "{{ ldap_auth_userdn }}"
      userattr: "{{ ldap_auth_userattr }}"
      groupdn: "{{ ldap_auth_groupdn }}"
      groupfilter: "(&(objectClass=groupOfNames)({% raw %}member={{.UserDN}}{% endraw %}))"
      groupattr: "{{ ldap_auth_groupattr }}"
      insecure_tls: false
      starttls: "{{ ldap_auth_starttls }}"
  no_log: true
  when: (ldap_config_fingerprint_check.data | default({}, true)).get('data', {}).get('data', {}).get('fingerprint', '') != ldap_config_desired_fingerprint
  register: ldap_config_write

- name: Enregistrer la nouvelle empreinte de configuration
  community.hashi_vault.vault_write:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: "{{ openbao_kv_mount }}/data/ansible-state/ldap-auth-config"
    data:
      data:
        fingerprint: "{{ ldap_config_desired_fingerprint }}"
  when: ldap_config_write is changed

- name: Lister les méthodes d'auth pour découvrir l'accessor LDAP
  community.hashi_vault.vault_read:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: sys/auth
  register: auth_list

- name: Extraire l'accessor du mount LDAP
  ansible.builtin.set_fact:
    ldap_auth_accessor: "{{ auth_list.data['ldap/'].accessor }}"

- name: Lire la policy admin actuelle
  community.hashi_vault.vault_read:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: sys/policies/acl/admin
  register: admin_policy_check
  failed_when: false

- name: Charger la policy admin (si modifiée)
  community.hashi_vault.vault_write:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: sys/policies/acl/admin
    data:
      policy: "{{ lookup('template', 'admin-policy.hcl.j2') }}"
  when: ((admin_policy_check.data | default({}, true)).get('data', {}).get('policy', '') | trim) != (lookup('template', 'admin-policy.hcl.j2') | trim)

- name: Lire la policy utilisateur actuelle
  community.hashi_vault.vault_read:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: sys/policies/acl/utilisateur
  register: utilisateur_policy_check
  failed_when: false

- name: Charger la policy utilisateur (si modifiée)
  community.hashi_vault.vault_write:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: sys/policies/acl/utilisateur
    data:
      policy: "{{ lookup('template', 'utilisateur-policy.hcl.j2') }}"
  when: ((utilisateur_policy_check.data | default({}, true)).get('data', {}).get('policy', '') | trim) != (lookup('template', 'utilisateur-policy.hcl.j2') | trim)

- name: Lire le mapping actuel du groupe Administrateur
  community.hashi_vault.vault_read:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: "auth/ldap/groups/{{ ldap_admin_group }}"
  register: admin_group_check
  failed_when: false


- name: Mapper le groupe Administrateur à la policy admin (si modifié)
  community.hashi_vault.vault_write:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: "auth/ldap/groups/{{ ldap_admin_group }}"
    data:
      policies: admin
  when: (admin_group_check.data | default({}, true)).get('data', {}).get('policies', []) != ['admin']

- name: Lire le mapping actuel du groupe Utilisateurs
  community.hashi_vault.vault_read:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: "auth/ldap/groups/{{ ldap_user_group }}"
  register: utilisateur_group_check
  failed_when: false

- name: Mapper le groupe Utilisateurs à la policy utilisateur (si modifié)
  community.hashi_vault.vault_write:
    url: "{{ openbao_api_url }}"
    token: "{{ openbao_root_token }}"
    ca_cert: "{{ homelab_ca_local_cache }}"
    path: "auth/ldap/groups/{{ ldap_user_group }}"
    data:
      policies: utilisateur
  when: (utilisateur_group_check.data | default({}, true)).get('data', {}).get('policies', []) != ['utilisateur']