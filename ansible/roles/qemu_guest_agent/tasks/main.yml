---
- name: Installer qemu-guest-agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Démarrer qemu-guest-agent et l'activer au boot
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true
