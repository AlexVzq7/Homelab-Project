---
# SIGHUP : OpenBao relit sa configuration sans redémarrer, donc sans se resceller
- name: Recharger OpenBao
  ansible.builtin.command:
    cmd: docker kill --signal HUP openbao
  changed_when: true

- name: Redémarrer Caddy
  community.docker.docker_compose_v2:
    project_src: "{{ stack_dir }}"
    services: [caddy]
    state: restarted
