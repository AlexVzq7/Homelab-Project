---
openbao_image: "openbao/openbao:2.6.2"
caddy_image: "caddy:2.11.4"
openbao_domain: "vault.{{ homelab_domain }}"
openbao_node_id: "vault-node1"
openbao_gid: "1000"
openbao_uid: "100"

stack_dir: "/home/{{ ansible_user }}/openbao"
openbao_data_dir: "{{ stack_dir }}/openbao-data"

caddy_trusted_root_host: "{{ stack_dir }}/step_root_ca.crt"
caddy_trusted_root_container: "/etc/caddy/step_root_ca.crt"

caddy_acme_directory: "https://192.168.1.105:9000/acme/acme/directory"
