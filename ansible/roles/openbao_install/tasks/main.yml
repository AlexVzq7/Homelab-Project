---
# tasks file for openbao

- name: Vérifier que le root CA step-ca est bien présent
  ansible.builtin.stat:
    path: "{{ caddy_trusted_root_host }}"
  register: step_root_ca

- name: Echouer si le root CA step-ca est absent
  ansible.builtin.fail:
    msg: "{{ caddy_trusted_root_host }} est introuvable après renommage"
  when: not step_root_ca.stat.exists

- name: Créer le dossier de données OpenBao  (stockage de raft)
  ansible.builtin.file:
    path: "{{ openbao_data_dir }}"
    state: directory
    mode: "0750"
    owner: "{{ openbao_uid }}"
    group: "{{ openbao_gid }}"

- name: Déployer la configuration OpenBao
  ansible.builtin.template:
    src: openbao-config.hcl.j2
    dest: "{{ stack_dir }}/openbao.hcl"
    owner: "{{ openbao_uid }}"
    group: "{{ openbao_gid }}"
    mode: "0640"
  notify: Redémarrer la stack OpenBao

- name: Déployer le Caddyfile (reverse proxy vers openbao au lieu de vaultwarden)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ stack_dir }}/Caddyfile"
    mode: "0640"
  notify: Redémarrer la stack OpenBao

- name: Déployer docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ stack_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Redémarrer la stack OpenBao
  
- name: Démarrer la stack OpenBao + Caddy
  community.docker.docker_compose_v2:
    project_src: "{{ stack_dir }}"
    remove_orphans: true
    state: present

- name: Attendre que le port 8200 (API OpenBao) réponde
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8200
    timeout: 60