---
- name: Déposer le certificat racine de la step-ca pour Caddy
  ansible.builtin.copy:
    src: "{{ homelab_ca_cert }}"
    dest: "{{ caddy_trusted_root_host }}"
    mode: "0644"
  notify: Redémarrer Caddy

- name: Créer le dossier de données OpenBao (stockage raft)
  ansible.builtin.file:
    path: "{{ openbao_data_dir }}"
    state: directory
    mode: "0750"
    owner: "{{ openbao_uid }}"
    group: "{{ openbao_gid }}"

- name: Déployer la configuration OpenBao
  ansible.builtin.template:
    src: openbao-config.hcl.j2
    dest: "{{ stack_dir }}/openbao.hcl"
    owner: "{{ openbao_uid }}"
    group: "{{ openbao_gid }}"
    mode: "0640"
  notify: Recharger OpenBao

- name: Déployer le Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ stack_dir }}/Caddyfile"
    mode: "0640"
  notify: Redémarrer Caddy

# docker compose ne recrée que les services dont la définition a changé
- name: Déployer docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ stack_dir }}/docker-compose.yml"
    mode: "0640"

- name: Démarrer la stack OpenBao + Caddy
  community.docker.docker_compose_v2:
    project_src: "{{ stack_dir }}"
    remove_orphans: true
    state: present

- name: Attendre que le port 8200 (API OpenBao) réponde
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8200
    timeout: 60
