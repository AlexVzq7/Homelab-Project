---
- name: Certificat TLS LDAP (step-ca)
  ansible.builtin.include_role:
    name: step_certificate
  vars:
    step_cert_name: ldap
    step_cert_label: LDAP
    step_cert_cn: "{{ ldap_tls_cn }}"
    step_cert_file: "{{ ldap_tls_cert }}"
    step_key_file: "{{ ldap_tls_key }}"
    step_ca_file: "{{ ldap_tls_ca }}"
    step_cert_owner: "{{ slapd_user }}"
    step_cert_group: "{{ slapd_group }}"
    step_key_mode: "0640"
    step_cert_reload_cmd: systemctl restart slapd

- name: Configurer TLS dans cn=config
  community.general.ldap_attrs:
    dn: cn=config
    attributes:
      olcTLSCertificateFile: "{{ ldap_tls_cert }}"
      olcTLSCertificateKeyFile: "{{ ldap_tls_key }}"
      olcTLSCACertificateFile: "{{ ldap_tls_ca }}"
    state: exact
  notify: Redémarrer slapd

- name: Définir les ports d'écoute de slapd
  ansible.builtin.lineinfile:
    path: /etc/default/slapd
    regexp: '^SLAPD_SERVICES='
    line: 'SLAPD_SERVICES="{{ slapd_services }}"'
  notify: Redémarrer slapd
