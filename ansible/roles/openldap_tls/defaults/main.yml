---
ldap_tls_cn: "openldap.{{ homelab_domain }}"

slapd_user: "openldap"
slapd_group: "openldap"
ldap_tls_cert: /etc/ldap/tls/ldap.crt
ldap_tls_key: /etc/ldap/tls/ldap.key
ldap_tls_ca: /etc/ldap/tls/ca.crt

# LDAP en clair (389) fermé : seulement LDAPS (636) et le socket local ldapi
slapd_services: "ldaps:/// ldapi:///"
